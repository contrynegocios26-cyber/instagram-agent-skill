# Uma marina por instalação. Suba com:  docker compose up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: app/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      COOKIE_SEGURO: "1"
    volumes:
      - dados:/dados
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  dados:
  caddy_data:
  caddy_config:
